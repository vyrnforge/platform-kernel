name: Platform Kernel Pages
on:
  pull_request:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    outputs:
      js_sha256: ${{ steps.digests.outputs.js_sha256 }}
      css_sha256: ${{ steps.digests.outputs.css_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Test content and build
        working-directory: site
        run: |
          npm test
          npm run build
      - name: Link, version and bundle quality gates
        working-directory: site
        run: node scripts/site-quality.mjs
      - name: Compute exact build asset provenance
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          echo "js_sha256=$(sha256sum site/dist/app.js | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "css_sha256=$(sha256sum site/dist/app.css | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Browser smoke and semantic QA (Chrome)
        working-directory: site
        run: node scripts/browser-smoke.mjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The deploy job runs on a fresh runner; the verification script does not
      # exist here unless we check out the same commit that produced the build.
      - name: Checkout verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node 22 for public verification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Verify public Pages asset provenance after deploy
        env:
          PUBLIC_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          BUILT_JS_SHA256: ${{ needs.build.outputs.js_sha256 }}
          BUILT_CSS_SHA256: ${{ needs.build.outputs.css_sha256 }}
        run: node site/scripts/verify-deployment.mjs "$PUBLIC_PAGES_URL" "$BUILT_JS_SHA256" "$BUILT_CSS_SHA256"
