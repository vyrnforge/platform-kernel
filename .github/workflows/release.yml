name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: publish
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          pom_version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse("pom.xml").getroot()
          ns={"m":"http://maven.apache.org/POM/4.0.0"}
          print(root.find("m:version",ns).text)
          PY
          )"
          test "$version" = "$pom_version"
          test "$version" = "0.2.0"

      - name: Contract compatibility
        run: python3 scripts/check-contract-compatibility.py

      - name: Maven verify and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: mvn --batch-mode --no-transfer-progress --strict-checksums deploy

      - name: Create immutable V2 GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag"               --target "$GITHUB_SHA"               --title "Kernel V2 — $tag"               --notes-file CHANGELOG.md
          fi
