name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-public-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:'))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Reject existing tag and Central version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tags="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$version" --jq '.[].ref')"
          ! grep -Fxq "refs/tags/v$version" <<< "$tags"
          for artifact in platform-kernel-parent platform-kernel platform-kernel-jdbc platform-kernel-testkit; do
            code="$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' "https://repo.maven.apache.org/maven2/io/github/vyrnforge/$artifact/$version/$artifact-$version.pom")"
            test "$code" = 404 || { echo "Central version exists or probe failed ($code); stop and reconcile"; exit 1; }
          done
      - name: Build and verify once
        run: |
          python3 scripts/check-contract-compatibility.py
          bash scripts/verify-core.sh
          mvn --batch-mode --no-transfer-progress --strict-checksums -Prelease-docs clean verify
          python3 scripts/check-distribution.py --release-docs
          python3 scripts/stage-release.py "$RUNNER_TEMP/release-stage"
      - name: Sign release bundle
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/sign-release.sh "$RUNNER_TEMP/release-stage"
      - name: Publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: bash scripts/publish-central.sh
      - name: Mirror verified Central payload to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/mirror-release.sh "$RUNNER_TEMP/release-stage"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          gh release create "v$version" \
            "platform-kernel/target/platform-kernel-$version.jar" \
            "kernel-persistence-jdbc/target/platform-kernel-jdbc-$version.jar" \
            "kernel-testkit/target/platform-kernel-testkit-$version.jar" \
            --target "$GITHUB_SHA" --title "Kernel — v$version" --notes-file CHANGELOG.md
