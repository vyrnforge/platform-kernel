name: release

on:
  push:
    branches: [main]
    paths: ['VERSION', 'docs/releases/recovery/*.json']
  workflow_dispatch:
    inputs:
      recovery_record:
        description: 'Existing deployment recovery JSON (required for manual recovery)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kernel-public-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Reject existing tag and Central version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tags="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$version" --jq '.[].ref')"
          ! grep -Fxq "refs/tags/v$version" <<< "$tags"
          for artifact in platform-kernel-parent platform-kernel platform-kernel-jdbc platform-kernel-testkit; do
            code="$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' "https://repo.maven.apache.org/maven2/io/github/vyrnforge/$artifact/$version/$artifact-$version.pom")"
            test "$code" = 404 || { echo "Central version exists or probe failed ($code); stop and reconcile"; exit 1; }
          done
      - name: DOCSEC verify public-source disclosure policy before tagging
        run: |
          python3 -m unittest discover -s scripts/tests -p test_docsec_publication.py -v
          python3 scripts/check-docsec-publication.py --source

      - name: Reserve exact source tag before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$version" -f sha="$GITHUB_SHA" >/dev/null
      - name: Build and verify once
        run: |
          python3 scripts/check-contract-compatibility.py
          bash scripts/verify-core.sh
          mvn --batch-mode --no-transfer-progress --strict-checksums -Prelease-docs clean verify
          python3 scripts/check-distribution.py --release-docs
          python3 scripts/stage-release.py "$RUNNER_TEMP/release-stage"
      - name: DOCSEC inspect exact release JAR, source and Javadoc contents
        run: python3 scripts/check-docsec-publication.py --jars

      - name: Sign release bundle
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/sign-release.sh "$RUNNER_TEMP/release-stage"
      - name: Publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: bash scripts/publish-central.sh
      - name: Mirror verified Central payload to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/mirror-release.sh "$RUNNER_TEMP/release-stage"
      - name: Verify anonymous Central consumer
        run: bash scripts/verify-central-consumer.sh "$(tr -d '[:space:]' < VERSION)"
      - name: Create and verify GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/complete-github-release.sh "$(tr -d '[:space:]' < VERSION)" "$GITHUB_SHA" "$RUNNER_TEMP/release-stage"


  reconcile:
    name: reconcile existing Central release
    if: >-
      github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.recovery_record != '') || startsWith(github.event.head_commit.message, 'ops: reconcile Central'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      RECOVERY_RECORD: ${{ inputs.recovery_record || 'docs/releases/recovery/0.3.1.json' }}
    steps:
      - name: Checkout reviewed source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Inspect existing deployment and retrieve signed payloads
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$RECOVERY_RECORD" =~ ^docs/releases/recovery/[0-9]+\.[0-9]+\.[0-9]+\.json$ ]]
          bash scripts/recover-central.sh "$RECOVERY_RECORD" "$RUNNER_TEMP/release-stage"
      - name: Verify anonymous Central consumer
        run: bash scripts/verify-central-consumer.sh "$(jq -r '.version' "$RECOVERY_RECORD")"
      - name: Mirror original Central bytes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/mirror-release.sh "$RUNNER_TEMP/release-stage" "$(jq -r '.version' "$RECOVERY_RECORD")"
      - name: Complete GitHub release at original source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/complete-github-release.sh "$(jq -r '.version' "$RECOVERY_RECORD")" "$(jq -r '.sourceCommit' "$RECOVERY_RECORD")" "$RUNNER_TEMP/release-stage"
