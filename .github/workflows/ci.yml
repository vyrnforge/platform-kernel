name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Contract compatibility baseline
        run: python3 scripts/check-contract-compatibility.py

      - name: Dependency-free core smoke verification
        run: bash scripts/verify-core.sh

      # This verifier is test-only; keep the interpreter and its entire
      # resolved wheel closure reproducible rather than floating on runner updates.
      - name: Set up Python 3.14.10 for schema conformance
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.10'

      - name: Released JSON Schema draft 2020-12 behavioral shape vectors
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/schema-validation-venv"
          "$RUNNER_TEMP/schema-validation-venv/bin/python" -c 'import sys; assert sys.version_info[:3] == (3, 14, 10), sys.version'
          "$RUNNER_TEMP/schema-validation-venv/bin/python" -m pip install --no-input --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/requirements-schema-202012.lock
          "$RUNNER_TEMP/schema-validation-venv/bin/python" -m pip check
          "$RUNNER_TEMP/schema-validation-venv/bin/python" -m pip freeze
          "$RUNNER_TEMP/schema-validation-venv/bin/python" scripts/test-json-schema-202012.py

      - name: Maven verification
        run: mvn --batch-mode --no-transfer-progress --strict-checksums -Prelease-docs clean verify

      - name: Verify three physical JARs and packaged consumer
        run: python3 scripts/check-distribution.py --release-docs

      - name: Real File Storage candidate compatibility
        run: bash scripts/verify-file-storage-consumer.sh

      - name: Stage Maven publication inventory (no credentials)
        run: python3 scripts/stage-release.py "$RUNNER_TEMP/release-stage"
