name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  actions: read
  security-events: write
  packages: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # Keep the required 'CodeQL' check present even for Pages-only PRs.
      # Scheduled and manually dispatched scans always analyze all Java code.
      - name: Determine Java analysis scope
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci_scope.py --event "$GITHUB_EVENT_NAME" --before "$BEFORE_SHA" --output "$GITHUB_OUTPUT"

      - name: Explain CodeQL routing
        env:
          RUN_CODEQL: ${{ steps.scope.outputs.codeql }}
        run: |
          if [[ "$RUN_CODEQL" == true ]]; then
            echo 'Running Java/Kotlin CodeQL analysis.'
          else
            echo 'Skipping Java/Kotlin analysis: no Kernel library or security workflow changes.'
          fi
      - name: Initialize CodeQL
        if: steps.scope.outputs.codeql == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: Analyze
        if: steps.scope.outputs.codeql == 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:java-kotlin
