name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # This check is required, so keep it on every PR; the dependency
      # action itself only runs for manifest/lockfile/supply-chain changes.
      - name: Determine dependency review scope
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci_scope.py --event "$GITHUB_EVENT_NAME" --before "$BEFORE_SHA" --output "$GITHUB_OUTPUT"

      - name: Explain dependency review routing
        env:
          RUN_DEPENDENCY: ${{ steps.scope.outputs.dependency }}
        run: |
          if [[ "$RUN_DEPENDENCY" == true ]]; then
            echo 'Review dependency changes.'
          else
            echo 'No manifest, lockfile, or supply-chain workflow changes: dependency diff not applicable.'
          fi
      - name: Review dependency changes
        if: steps.scope.outputs.dependency == 'true'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          fail-on-scopes: development,runtime

