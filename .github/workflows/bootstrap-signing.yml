name: Bootstrap release signing

# One-time owner-operated setup. No release or publishing happens here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-release-signing
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate and store dedicated release key
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SIGNING_BOOTSTRAP_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$GH_TOKEN" || { echo "Missing SIGNING_BOOTSTRAP_TOKEN"; exit 1; }
          names="$(gh secret list --repo "$GH_REPO" --json name --jq '.[].name')"
          for name in GPG_PRIVATE_KEY GPG_PASSPHRASE GPG_REVOCATION_CERT; do
            if grep -Fxq "$name" <<< "$names"; then
              echo "Existing signing secret $name; refusing to overwrite or rotate."
              exit 1
            fi
          done
          work="$(mktemp -d)"
          export GNUPGHOME="$work/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          cleanup() {
            gpgconf --kill all >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT
          # Random passphrase never written to logs or a workflow output.
          passphrase="$(openssl rand -hex 32)"
          echo "::add-mask::$passphrase"
          printf '%s\n' "$passphrase" > "$work/passphrase"
          gpg --batch --pinentry-mode loopback --passphrase-file "$work/passphrase" \
            --quick-generate-key "VyrnForge Release Signing" rsa4096 sign 1y
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')"
          test "${#fingerprint}" -eq 40
          gpg --batch --pinentry-mode loopback --passphrase-file "$work/passphrase" \
            --armor --export-secret-keys "$fingerprint" > "$work/private.asc"
          test -s "$work/private.asc"
          revocation="$GNUPGHOME/openpgp-revocs.d/$fingerprint.rev"
          test -s "$revocation"
          printf 'VyrnForge signing bootstrap self-test\n' > "$work/probe"
          gpg --batch --pinentry-mode loopback --passphrase-file "$work/passphrase" \
            --local-user "$fingerprint" --armor --detach-sign "$work/probe"
          # Public key only; never send private key or revocation certificate.
          for attempt in 1 2 3; do
            if timeout 45 gpg --batch --keyserver hkps://keyserver.ubuntu.com --send-keys "$fingerprint"; then
              break
            fi
            test "$attempt" -lt 3 || exit 1
            sleep 5
          done
          mkdir -m 700 "$work/verify"
          for attempt in 1 2 3; do
            if timeout 45 gpg --homedir "$work/verify" --batch \
                --keyserver hkps://keyserver.ubuntu.com --recv-keys "$fingerprint" &&
               gpg --homedir "$work/verify" --batch --verify "$work/probe.asc" "$work/probe"; then
              break
            fi
            test "$attempt" -lt 3 || exit 1
            sleep 5
          done
          # gh encrypts each value using the repository public key before upload.
          # No secret value appears in arguments, logs, artifacts or source.
          gh secret set GPG_PASSPHRASE --repo "$GH_REPO" < "$work/passphrase"
          gh secret set GPG_PRIVATE_KEY --repo "$GH_REPO" < "$work/private.asc"
          gh secret set GPG_REVOCATION_CERT --repo "$GH_REPO" < "$revocation"
          echo "Release signing key fingerprint: $fingerprint"
          echo "Public key retrieved and signature verified."
          gh secret list --repo "$GH_REPO" --json name --jq '.[].name'
          echo "Owner: revoke temporary token and remove SIGNING_BOOTSTRAP_TOKEN."
