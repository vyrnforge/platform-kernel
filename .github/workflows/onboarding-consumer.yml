name: Published onboarding consumer
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/src/docs-data.mjs'
      - 'site/scripts/verify-onboarding.mjs'
      - 'site/scripts/verify-onboarding-windows.mjs'
      - 'site/src/IntegrationWorkbench.jsx'
      - 'site/src/capability-guides.mjs'
      - '.github/workflows/onboarding-consumer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  released-v032:
    name: verify published first Java consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SHA-256-verified Gradle 8.14.3
        shell: bash
        run: |
          set -euo pipefail
          base='https://services.gradle.org/distributions/gradle-8.14.3-bin.zip'
          curl --fail --location --retry 3 --silent --show-error "$base" --output "$RUNNER_TEMP/gradle.zip"
          curl --fail --location --retry 3 --silent --show-error "$base.sha256" --output "$RUNNER_TEMP/gradle.sha256"
          (cd "$RUNNER_TEMP" && echo "$(cat gradle.sha256)  gradle.zip" | sha256sum --check --status)
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"
      - name: Verify published Java 21 consumer from the website examples
        run: node site/scripts/verify-onboarding.mjs

  published-windows:
    name: verify website first Java program on Windows PowerShell
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify published Windows first-program commands
        shell: pwsh
        run: node site/scripts/verify-onboarding-windows.mjs
